<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Skadoush — 3 Prototypes Animés</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { overflow-x: hidden; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }

  /* Entrance keyframes never hide content at 0% — if the compositor pauses the
     animation (offscreen/print/export), the base state stays fully visible. */
  @keyframes skadIn { from { transform: translateY(16px); } to { transform: none; } }
  @keyframes skadPop { 0% { transform: scale(.72); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes skadFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes skadPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
